services:
  # ── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: ustatop-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: ustatop-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMS_PROVIDER
        value: mock          # eskiz ga o'zgartiring
      - key: ESKIZ_EMAIL
        value: ""
      - key: ESKIZ_PASSWORD
        value: ""
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ADMIN_PHONE
        value: "+998901234567"
      - key: ADMIN_SECRET_KEY
        value: "o'zingizning_maxfiy_kalitingiz"
      - key: CORS_ORIGIN
        value: "https://ustatop.vercel.app,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://ustatop.vercel.app"
      - key: PAYME_MERCHANT_ID
        value: ""
      - key: PAYME_SECRET_KEY
        value: ""
      - key: PAYME_TEST_SECRET_KEY
        value: ""
      - key: PAYME_TEST_MODE
        value: "false"
      - key: PAYME_REGISTRATION_AMOUNT
        value: "29000"

  # ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: ustatop-db
    region: frankfurt
    plan: free
    databaseName: ustatop
    user: ustatop_user
